[build]
  command = "npm run build"
  publish = "dist"

# Old multi-page URLs → client routes (single index.html)
[[redirects]]
  from = "/teams.html"
  to = "/teams"
  status = 301

[[redirects]]
  from = "/sponsor.html"
  to = "/partnerships"
  status = 301

# Legacy partner URLs → canonical
[[redirects]]
  from = "/partner"
  to = "/partnerships"
  status = 301

[[redirects]]
  from = "/partners"
  to = "/partnerships"
  status = 301

# Optional: canonical partnerships URL (many blocklists match /sponsor*)
[[redirects]]
  from = "/sponsor"
  to = "/partnerships"
  status = 302

# SPA: client routes (/teams, /partnerships, …) are not files; serve app shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
