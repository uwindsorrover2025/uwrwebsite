[build]
  command = "npm run build"
  publish = "dist"

# Old multi-page URLs → client routes (single index.html)
[[redirects]]
  from = "/teams.html"
  to = "/teams"
  status = 301

[[redirects]]
  from = "/sponsor.html"
  to = "/sponsor"
  status = 301

# SPA: /teams and /sponsor are not files; serve app shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
